<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfumowa Aura — perfumy niszowe</title>
    <meta name="description" content="Perfumowa Aura – perfumy niszowe komponowane i rozlewane w Krakowie. Figa, sól, bursztyn, bez, kadzidło i gorzka pomarańcza." />
    <meta name="theme-color" content="#111110" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Katalog z bazy pobierany równolegle z JS (src/data/products.ts). -->
    <link rel="preload" href="/api/catalog" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Schibsted+Grotesk:wght@400;500&display=swap"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>

    <header class="site-header surface-dark">
      <div class="site-header__inner">
        <nav class="site-nav" aria-label="Główna">
          <ul>
            <li><a href="/perfumy" data-nav>Perfumy</a></li>
            <li class="site-nav__extra"><a href="/perfumy?nowosci" data-nav>Nowości</a></li>
            <li class="site-nav__extra" data-hide-without-page="kontakt"><a href="/kontakt" data-nav>Kontakt</a></li>
          </ul>
        </nav>
        <a class="brand" href="/" aria-label="Perfumowa Aura – strona główna">Aura</a>
        <a class="cart" href="/koszyk" data-nav>Koszyk (<span data-cart-count>0</span>)</a>
      </div>
    </header>

    <div id="view"></div>

    <footer class="site-footer surface-dark">
      <div class="grid site-footer__grid">
        <div class="site-footer__about">
          <p class="brand brand--footer">Aura</p>
          <p class="site-footer__text">Perfumy niszowe komponowane i&nbsp;rozlewane w&nbsp;Krakowie, w&nbsp;partiach po kilkaset flakonów.</p>
        </div>
        <!-- Listy wypełnia src/main.ts danymi z panelu (kategorie, strony, ustawienia). -->
        <nav class="site-footer__col site-footer__col--catalog" aria-label="Katalog">
          <h2 class="label">Katalog</h2>
          <ul data-footer-catalog>
            <li><a href="/perfumy">Wszystkie perfumy</a></li>
          </ul>
        </nav>
        <nav class="site-footer__col site-footer__col--info" aria-label="Informacje">
          <h2 class="label">Informacje</h2>
          <ul data-footer-pages></ul>
        </nav>
        <div class="site-footer__col site-footer__col--contact">
          <h2 class="label">Kontakt</h2>
          <ul data-footer-contact></ul>
        </div>
        <p class="site-footer__legal">
          <span>© 2026 Perfumowa Aura</span>
        </p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
